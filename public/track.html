<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track your order – Jofus Ventures</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="brand">
  <a class="logo" href="/" aria-label="Jofus Ventures home"><img src="/logo.png" alt="Jofus Ventures"></a>
  <h1>TRACK YOUR ORDER</h1>
</header>

<div class="wrap" style="max-width:560px">
  <div class="card">
    <div id="banner"></div>

    <form id="lookup">
      <label for="id">Order number</label>
      <input id="id" placeholder="e.g. JV-A1B23456" required>
      <label for="phone">Phone number used for the order</label>
      <input id="phone" type="tel" placeholder="e.g. 0241234567" required>
      <div class="error" id="err"></div>
      <button class="btn" type="submit">🔎 Find my order</button>
      <button class="btn secondary" type="button" id="allBtn">📋 See all my orders (by phone)</button>
    </form>

    <div id="mine" style="display:none">
      <h2>My orders</h2>
      <div id="mineList"></div>
      <button class="btn secondary" id="mineBack">← Back</button>
    </div>

    <div id="order" style="display:none">
      <h2 id="title"></h2>
      <div id="summary" class="note" style="font-size:15px;color:var(--ink)"></div>
      <h3>Progress</h3>
      <ul class="steps" id="steps"></ul>
      <div id="actions"></div>
    </div>

    <div class="note" style="text-align:center;margin-top:16px"><a href="/">← Back to shop</a></div>
  </div>
</div>
<footer>Questions? Call <a id="callLink" href="#"></a></footer>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const params = new URLSearchParams(location.search);
  const PH_KEY = 'jofus_phone';
  if (params.get('id')) $('id').value = params.get('id');
  let savedPhone = ''; try { savedPhone = localStorage.getItem(PH_KEY) || ''; } catch {}
  if (savedPhone) $('phone').value = savedPhone;

  if (params.get('paid') === '1') $('banner').innerHTML = '<div class="success">✅ Payment successful! Your order has been placed. You will receive an SMS/WhatsApp confirmation shortly.</div>';
  if (params.get('paid') === '0') $('banner').innerHTML = '<div class="error" style="display:block">Payment was not completed. You can try again from the shop page or contact us.</div>';

  const FLOW = [
    ['placed', 'Order placed', 'We have received your order'],
    ['accepted', 'Accepted', 'The seller has accepted your order'],
    ['processing', 'Processing', 'Your order is being prepared'],
    ['ready', 'Ready', 'Ready for pickup / out for delivery'],
    ['delivered', 'Delivered', 'Please confirm you received it'],
    ['completed', 'Completed', 'Order closed. Thank you!'],
  ];

  async function load(id, phone) {
    const err = $('err'); err.style.display = 'none';
    const r = await fetch(`/api/orders/${encodeURIComponent(id.trim().toUpperCase())}?phone=${encodeURIComponent(phone)}`);
    const o = await r.json();
    if (!r.ok) { err.textContent = o.error; err.style.display = 'block'; return; }
    try { localStorage.setItem(PH_KEY, phone); } catch {}
    render(o, phone);
  }

  function render(o, phone) {
    $('lookup').style.display = 'none'; $('order').style.display = 'block';
    $('title').textContent = `Order ${o.id}`;
    $('callLink').href = 'tel:' + o.ownerPhone; $('callLink').textContent = o.ownerPhone;
    const fulfil = o.fulfilment === 'delivery' ? `Delivery to ${esc(o.address)}` : 'Pickup';
    const items = (o.items || []).map(i => `<div style="display:flex;justify-content:space-between;gap:8px"><b>${i.qty} × ${esc(i.name)}</b><span>GHS ${(i.qty * i.price).toFixed(2)}</span></div>`).join('');
    $('summary').innerHTML = `${items}<br>Total: <b>GHS ${o.amount.toFixed(2)}</b>${o.deliveryFee ? ' (incl. GHS ' + o.deliveryFee + ' delivery)' : ''} · Payment: <span class="pill ${o.payment.status === 'paid' ? 'paid' : 'unpaid'}">${o.payment.status}</span><br>${fulfil}<br><span style="color:var(--muted)">Placed ${new Date(o.createdAt).toLocaleString()}</span>`;

    const idx = o.status === 'cancelled' ? -1 : o.status === 'pending_payment' ? -1 : FLOW.findIndex(f => f[0] === o.status);
    $('steps').innerHTML = o.status === 'cancelled'
      ? '<li class="current"><span class="dot">✕</span><span class="lbl">Cancelled</span></li>'
      : FLOW.map((f, i) => `<li class="${i < idx ? 'done' : i === idx ? 'current' : ''}"><span class="dot">${i < idx ? '✓' : i + 1}</span><span class="lbl">${f[1]}<small>${f[2]}</small></span></li>`).join('');

    const wa = `https://wa.me/${o.ownerWhatsApp}?text=${encodeURIComponent(`Hello ${o.businessName}, this is ${o.name} about order ${o.id} (GHS ${o.amount}).`)}`;
    let actions = '';
    if (o.status === 'pending_payment') actions += `<div class="error" style="display:block">Payment not yet received for this order. Contact the seller if you have paid.</div>`;
    if (['ready', 'delivered'].includes(o.status)) {
      actions += `<button class="btn amber" id="confirmBtn">✅ I have received my order</button><div class="note" style="text-align:center">Tap this once you have the items in hand to close the order.</div>`;
    }
    if (o.status === 'completed') actions += `<div class="success">🎉 Thank you! Your order is complete.</div>`;
    actions += `<a class="btn whatsapp" href="${wa}" target="_blank" rel="noopener">💬 Message seller on WhatsApp</a>`;
    actions += `<a class="btn secondary" href="/">🛒 Order again</a>`;
    $('actions').innerHTML = actions;

    const cb = $('confirmBtn');
    if (cb) cb.onclick = async () => {
      cb.disabled = true; cb.textContent = 'Confirming…';
      const r = await fetch(`/api/orders/${o.id}/confirm`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone }) });
      const d = await r.json();
      if (!r.ok) { alert(d.error); cb.disabled = false; cb.textContent = '✅ I have received my order'; return; }
      render({ ...d.order, ownerWhatsApp: o.ownerWhatsApp, ownerPhone: o.ownerPhone, businessName: o.businessName }, phone);
    };
  }

  $('lookup').onsubmit = (e) => { e.preventDefault(); load($('id').value, $('phone').value); };

  // All orders for this phone
  $('allBtn').onclick = async () => {
    const phone = $('phone').value.trim(); const err = $('err'); err.style.display = 'none';
    if (!phone) { err.textContent = 'Enter the phone number you ordered with.'; err.style.display = 'block'; return; }
    const r = await fetch('/api/my-orders?phone=' + encodeURIComponent(phone)); const d = await r.json();
    if (!r.ok) { err.textContent = d.error; err.style.display = 'block'; return; }
    try { localStorage.setItem(PH_KEY, phone); } catch {}
    $('mineList').innerHTML = d.orders.length ? d.orders.map(o => `
      <div style="border:1px solid var(--b-100);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${o.id}</b><span class="pill ${o.status}">${esc(o.label)}</span></div>
        <div class="note" style="margin:2px 0 8px">${new Date(o.createdAt).toLocaleString()} · ${o.fulfilment === 'delivery' ? 'Delivery' : 'Pickup'} · Payment: <span class="pill ${o.payment.status === 'paid' ? 'paid' : 'unpaid'}">${o.payment.status}</span></div>
        ${o.items.map(i => `<div style="display:flex;justify-content:space-between;font-size:14px"><span>${i.qty} × ${esc(i.name)}</span><span>GHS ${(i.qty * i.price).toFixed(2)}</span></div>`).join('')}
        ${o.deliveryFee ? `<div style="display:flex;justify-content:space-between;font-size:14px;color:var(--muted)"><span>Delivery</span><span>GHS ${o.deliveryFee.toFixed(2)}</span></div>` : ''}
        <div style="display:flex;justify-content:space-between;font-weight:800;border-top:1px dashed var(--b-300);margin-top:6px;padding-top:6px"><span>Total</span><span>GHS ${o.amount.toFixed(2)}</span></div>
        <button class="btn small ghost" data-open="${o.id}" style="margin-top:8px">Track this order →</button>
      </div>`).join('') : '<div class="note">No orders found for this number yet.</div>';
    $('lookup').style.display = 'none'; $('mine').style.display = 'block';
    $('mineList').querySelectorAll('[data-open]').forEach(b => b.onclick = () => { $('mine').style.display = 'none'; load(b.dataset.open, phone); });
  };
  $('mineBack').onclick = () => { $('mine').style.display = 'none'; $('lookup').style.display = 'block'; };
  if (params.get('id') && savedPhone) load(params.get('id'), savedPhone);
})();
</script>
</body>
</html>
