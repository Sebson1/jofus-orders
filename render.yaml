services:
  - type: web
    name: jofus-orders
    env: node
    plan: free
    buildCommand: echo no-build-needed
    startCommand: npm start
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: MNOTIFY_API_KEY
        sync: false
      - key: MNOTIFY_SENDER_ID
        value: Jofus
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
